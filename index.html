<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>coupon maker</title>
<style>
:root{--green:#105e58;--ink:#173b38;--line:#d6e5e3;--paper:#f6faf9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:serif}
.app{max-width:980px;margin:0 auto;padding:34px 24px 48px}
.head{margin-bottom:18px}
h1{margin:0;font-size:28px;color:var(--green)}
.preview{position:relative;border:1px solid var(--line);border-radius:18px;padding:12px;
box-shadow:0 14px 40px #0d464014;overflow:hidden;background:#eef4f3}
canvas{display:block;width:100%;height:auto;border-radius:10px;cursor:pointer}
.tools{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;
box-shadow:0 14px 40px #0d464014}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.full-row{grid-column:1/-1}
.top-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}
input{width:100%;height:44px;border:1px solid #b9cecb;border-radius:10px;padding:0 12px;
font:15px inherit;color:var(--ink);background:#fff;outline:none}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #105e5818}
input[type=file]{padding:8px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.stepper button{height:44px}
.num{text-align:center;font-size:17px}
button{border:1px solid #b9cecb;border-radius:10px;background:#fff;color:var(--ink);
font:700 14px inherit;cursor:pointer}
button:hover{border-color:var(--green);background:#f1f8f7}
.actions{display:flex;gap:10px;margin-top:20px}
.primary,.secondary{height:46px;flex:1}
.primary{border:0;background:var(--green);color:#fff}
.primary:hover{background:#0b4d48}
.credit{text-align:center;margin-top:18px;font-size:12px;color:#7b8d8a}
@media(max-width:680px){
 .app{padding:22px 14px}
 .fields,.top-row{grid-template-columns:1fr}
 .actions{flex-direction:column}
}
</style>
</head>
<body>
<main class="app">
 <div class="head"><h1>coupon maker</h1></div>
 <div class="preview">
  <canvas id="coupon" width="2048" height="1152" tabindex="0" aria-label="쿠폰 미리보기"></canvas>
 </div>

 <section class="tools">
  <div class="fields">
   <div class="full-row top-row">
    <div class="field">
     <label for="couponName">쿠폰 이름</label>
     <input id="couponName" maxlength="30" value="대학원생 글커미션">
    </div>
    <div class="field">
     <label for="stampCount">도장 개수</label>
     <div class="stepper">
      <button id="minus" type="button">−</button>
      <input class="num" id="stampCount" type="number" min="0" max="10" value="0">
      <button id="plus" type="button">＋</button>
     </div>
    </div>
   </div>

   <div class="full-row field">
    <label for="stampUpload">도장 이미지</label>
    <input id="stampUpload" type="file" accept="image/*">
   </div>

   <div class="field">
    <label for="benefit1">첫 번째 혜택 문구</label>
    <input id="benefit1" maxlength="5" value="5자 이내">
   </div>
   <div class="field">
    <label for="benefit2">두 번째 혜택 문구</label>
    <input id="benefit2" maxlength="5" value="5자 이내">
   </div>
   <div class="field">
    <label for="name">신청인</label>
    <input id="name" maxlength="24" placeholder="신청인 이름">
   </div>
   <div class="field">
    <label for="date">발행 일자</label>
    <input id="date" type="date">
   </div>
  </div>

  <div class="actions">
   <button class="secondary" id="resetStamp" type="button">도장 초기화</button>
   <button class="primary" id="downloadPng" type="button">PNG 저장</button>
   <button class="secondary" id="downloadJpg" type="button">JPG 저장</button>
  </div>
 </section>
 <div class="credit">coupon maker · 출처 대학원생 글커미션 @tiredsotired</div>
</main>

const couponFont="serif";
const titleColor='#105e58', lineColor='#105e58', bodyColor='#105e58', guideColor='#105e58';

const slots=[
 {x:300,y:665},{x:660,y:665},{x:1020,y:665},{x:1380,y:665},{x:1740,y:665},
 {x:300,y:920},{x:660,y:920},{x:1020,y:920},{x:1380,y:920},{x:1740,y:920}
];
let marked=Array(10).fill(false);
const positions={title:{x:1024,y:165},name:{x:190,y:390},date:{x:1315,y:390},stamps:{x:1020,y:792.5}};
let dragging=null,selectedElement=null,dragOffset={x:0,y:0},suppressClick=false;

const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
dateEl.value=today();

function fileToDataUrl(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
 });
}

bg.onload=()=>{bgReady=true;draw()};
bg.src=fixedBgSrc;
stamp.onload=()=>{stampReady=true;draw()};
stamp.src=defaultStampSrc;

function fittedText(text,maxWidth,startSize,weight=700){
 let size=startSize;
 ctx.font=`${weight} ${size}px ${couponFont}`;
 while(size>28&&ctx.measureText(text).width>maxWidth){
  size-=2;ctx.font=`${weight} ${size}px ${couponFont}`;
 }
 return size;
}
function formatDate(v){
 if(!v)return '';
 const [y,m,d]=v.split('-');
 return `${y}. ${m}. ${d}.`;
}
function drawCover(img){
 const cw=canvas.width,ch=canvas.height,ir=img.width/img.height,cr=cw/ch;
 let sx=0,sy=0,sw=img.width,sh=img.height;
 if(ir>cr){sw=img.height*cr;sx=(img.width-sw)/2}
 else{sh=img.width/cr;sy=(img.height-sh)/2}
 ctx.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);
}
function drawStamp(img,x,y,size){
 ctx.save();
 const scale=Math.min(size/img.width,size/img.height);
 const w=img.width*scale,h=img.height*scale;
 ctx.drawImage(img,x-w/2,y-h/2,w,h);
 ctx.restore();
}
function benefitText(text,x,y){
 if(!text)return;
 ctx.save();ctx.fillStyle=bodyColor;ctx.textAlign='center';ctx.textBaseline='middle';
 const chars=[...text];
 const lines=chars.length>3?[chars.slice(0,Math.ceil(chars.length/2)).join(''),chars.slice(Math.ceil(chars.length/2)).join('')]:[text];
 let size=52;ctx.font=`700 ${size}px ${couponFont}`;
 while(size>32&&Math.max(...lines.map(v=>ctx.measureText(v).width))>220){
  size-=2;ctx.font=`700 ${size}px ${couponFont}`;
 }
 lines.forEach((line,i)=>ctx.fillText(line,x,y+(i-(lines.length-1)/2)*(size+7)));
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(bgReady)drawCover(bg);

 const title=couponNameEl.value.trim()||'대학원생 글커미션';
 ctx.fillStyle=titleColor;ctx.textAlign='center';ctx.textBaseline='alphabetic';
 fittedText(title,1650,86);ctx.fillText(title,positions.title.x,positions.title.y);

 ctx.strokeStyle=lineColor;ctx.lineWidth=6;ctx.beginPath();
 ctx.moveTo(positions.title.x-634,positions.title.y+60);
 ctx.lineTo(positions.title.x+634,positions.title.y+60);ctx.stroke();

 ctx.textAlign='start';ctx.textBaseline='middle';ctx.font=`400 48px ${couponFont}`;ctx.fillStyle=bodyColor;
 const nameText=nameEl.value.trim()||'이름을 입력해주세요';
 const dateText=formatDate(dateEl.value)||'날짜를 입력해주세요';
 ctx.fillText('신청인',positions.name.x,positions.name.y);
 ctx.fillText(nameText,positions.name.x+200,positions.name.y);
 const dateGap=72,labelWidth=ctx.measureText('발행일자').width;
 ctx.fillText('발행일자',positions.date.x,positions.date.y);
 ctx.fillText(dateText,positions.date.x+labelWidth+dateGap,positions.date.y);

 ctx.save();ctx.strokeStyle=guideColor;ctx.globalAlpha=.55;ctx.lineWidth=4;ctx.setLineDash([16,14]);
 slots.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,118,0,Math.PI*2);ctx.stroke()});
 ctx.restore();

 benefitText(benefit1El.value.trim(),slots[4].x,slots[4].y);
 benefitText(benefit2El.value.trim(),slots[9].x,slots[9].y);

 if(stampReady)marked.forEach((on,i)=>{
  if(on){ctx.globalAlpha=.96;drawStamp(stamp,slots[i].x,slots[i].y,235);ctx.globalAlpha=1}
 });
 if(selectedElement)drawSelectionBox(selectedElement);
 stampCount.value=marked.filter(Boolean).length;
}

function setCount(n){
 n=Math.max(0,Math.min(10,Number(n)||0));
 marked=marked.map((_,i)=>i<n);draw();
}
[nameEl,dateEl,couponNameEl,benefit1El,benefit2El].forEach(el=>el.addEventListener('input',draw));
stampCount.addEventListener('input',e=>setCount(e.target.value));
document.querySelector('#minus').onclick=()=>setCount(marked.filter(Boolean).length-1);
document.querySelector('#plus').onclick=()=>setCount(marked.filter(Boolean).length+1);

stampUpload.addEventListener('change',async()=>{
 const file=stampUpload.files&&stampUpload.files[0];if(!file)return;
 try{
  const data=await fileToDataUrl(file);
  stamp.onload=()=>{stampReady=true;draw()};
  stamp.src=data;
 }catch(e){alert('도장 이미지를 불러오지 못했어. 다른 이미지 파일을 사용해줘.')}
});
document.querySelector('#resetStamp').onclick=()=>{
 stampUpload.value='';stampReady=false;
 stamp.onload=()=>{stampReady=true;draw()};
 stamp.src=defaultStampSrc;
};

function canvasPoint(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
function elementAt(x,y){
 ctx.save();fittedText(couponNameEl.value.trim()||'대학원생 글커미션',1650,86);
 const tw=Math.min(1650,ctx.measureText(couponNameEl.value.trim()||'대학원생 글커미션').width);ctx.restore();
 if(x>=positions.title.x-tw/2-45&&x<=positions.title.x+tw/2+45&&y>=positions.title.y-100&&y<=positions.title.y+85)return 'title';

 ctx.save();ctx.font=`400 48px ${couponFont}`;
 const nw=200+ctx.measureText(nameEl.value.trim()||'이름을 입력해주세요').width;ctx.restore();
 if(x>=positions.name.x-25&&x<=positions.name.x+nw+30&&y>=positions.name.y-55&&y<=positions.name.y+55)return 'name';

 ctx.save();ctx.font=`400 48px ${couponFont}`;
 const dt=formatDate(dateEl.value)||'날짜를 입력해주세요';
 const dateRight=positions.date.x+ctx.measureText('발행일자').width+72+ctx.measureText(dt).width;ctx.restore();
 if(x>=positions.date.x-25&&x<=dateRight+25&&y>=positions.date.y-55&&y<=positions.date.y+55)return 'date';

 const inStampArea=x>=145&&x<=1895&&y>=520&&y<=1065;
 const inStampCircle=slots.some(s=>Math.hypot(x-s.x,y-s.y)<135);
 if(inStampArea&&!inStampCircle)return 'stamps';
 return null;
}
function selectionBounds(key){
 if(key==='stamps'){
  const xs=slots.map(p=>p.x),ys=slots.map(p=>p.y),pad=150;
  return {x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
 }
 if(key==='title')return {x:positions.title.x-700,y:positions.title.y-100,w:1400,h:180};
 if(key==='name')return {x:positions.name.x-28,y:positions.name.y-58,w:700,h:116};
 return {x:positions.date.x-28,y:positions.date.y-58,w:700,h:116};
}
function drawSelectionBox(key){
 const b=selectionBounds(key);ctx.save();ctx.strokeStyle='#105e58';ctx.lineWidth=3;ctx.setLineDash([12,10]);
 ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.restore();
}

canvas.addEventListener('pointerdown',e=>{
 const p=canvasPoint(e),hit=elementAt(p.x,p.y);if(!hit)return;
 selectedElement=hit;draw();dragging=hit;
 dragOffset.x=p.x-positions[hit].x;dragOffset.y=p.y-positions[hit].y;
 suppressClick=false;canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';canvas.focus();e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
 const p=canvasPoint(e);
 if(dragging){
  const nx=p.x-dragOffset.x,ny=p.y-dragOffset.y;
  if(Math.hypot(nx-positions[dragging].x,ny-positions[dragging].y)>2)suppressClick=true;
  if(dragging==='stamps'){
   const minX=Math.min(...slots.map(v=>v.x)),maxX=Math.max(...slots.map(v=>v.x));
   const minY=Math.min(...slots.map(v=>v.y)),maxY=Math.max(...slots.map(v=>v.y));
   const dx=Math.max(150-minX,Math.min(canvas.width-150-maxX,nx-positions.stamps.x));
   const dy=Math.max(150-minY,Math.min(canvas.height-150-maxY,ny-positions.stamps.y));
   slots.forEach(v=>{v.x+=dx;v.y+=dy});positions.stamps.x+=dx;positions.stamps.y+=dy;
  }else{
   positions[dragging].x=Math.max(40,Math.min(canvas.width-40,nx));
   positions[dragging].y=Math.max(70,Math.min(canvas.height-50,ny));
  }
  draw();return;
 }
 canvas.style.cursor=elementAt(p.x,p.y)?'grab':'pointer';
});
function endDrag(e){
 if(!dragging)return;dragging=null;
 try{canvas.releasePointerCapture(e.pointerId)}catch(_){
 }
 canvas.style.cursor='pointer';
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

canvas.addEventListener('click',e=>{
 if(suppressClick){suppressClick=false;return}
 const p=canvasPoint(e);
 if(elementAt(p.x,p.y))return;
 if(selectedElement){selectedElement=null;draw()}
 let best=-1,dist=Infinity;
 slots.forEach((s,i)=>{const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<dist){dist=d;best=i}});
 if(best>=0&&dist<135){marked[best]=!marked[best];draw()}
});

function save(type){
 const prev=selectedElement;selectedElement=null;draw();
 const ext=type==='image/png'?'png':'jpg',a=document.createElement('a');
 a.download=`커미션_쿠폰_${nameEl.value.trim()||'발행본'}.${ext}`;
 a.href=canvas.toDataURL(type,type==='image/jpeg'?.95:undefined);a.click();
 selectedElement=prev;draw();
}
document.querySelector('#downloadPng').onclick=()=>save('image/png');
document.querySelector('#downloadJpg').onclick=()=>save('image/jpeg');
draw();
</script>
</body>
</html>
